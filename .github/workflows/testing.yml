name: PHPUnit

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    # Pinned to match config.platform.php: some deps (symfony 8, mistralys/text-diff)
    # require 8.4, so an unpinned runner tests an unsupported PHP version.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: gd, intl, iconv, sqlite3, pdo_sqlite, zip
        coverage: none
    # No Node/pnpm here on purpose: the suite calls withoutVite() and builds no assets.
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs
    - name: Start Meilisearch
      run: docker run -d -it --rm   -p 7700:7700   -v $(pwd)/meili_data:/meili_data   getmeili/meilisearch:v1.8
    - name: Start Mailhog
      run: docker run -d -p 8025:8025 -p 1025:1025 mailhog/mailhog
    - name: Pest
      run: php vendor/bin/pest --stop-on-defect
