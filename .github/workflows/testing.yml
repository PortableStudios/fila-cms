name: PHPUnit

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    # Pinned to match config.platform.php: some deps (symfony 8, mistralys/text-diff)
    # require 8.4, so an unpinned runner tests an unsupported PHP version.
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: gd, intl, iconv, sqlite3, pdo_sqlite, zip
        coverage: none
    # Version comes from the packageManager field; passing it here too is a hard error.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # tests/TestCase.php runs `pnpm run build` in setUp. Without pnpm present that
    # silently no-ops (Process::run does not throw) and tests run without assets.
    - name: Install JS dependencies
      run: pnpm install --frozen-lockfile
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs
    - name: Start Meilisearch
      run: docker run -d -it --rm   -p 7700:7700   -v $(pwd)/meili_data:/meili_data   getmeili/meilisearch:v1.8
    - name: Start Mailhog
      run: docker run -d -p 8025:8025 -p 1025:1025 mailhog/mailhog
    - name: Pest
      run: php vendor/bin/pest --stop-on-defect
