name: PHP Composer

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: gd, intl, iconv, sqlite3, pdo_sqlite, zip
        coverage: none
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs
    - name: Laravel Pint
      run: php vendor/bin/pint --test

  security-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: gd, intl, iconv, sqlite3, pdo_sqlite, zip
        coverage: none
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --ignore-platform-reqs
    # Fails the build on any known advisory, so vulnerable deps surface here
    # rather than in a Dependabot backlog.
    - name: Composer audit
      run: composer audit
    - name: pnpm audit
      run: pnpm install --frozen-lockfile && pnpm audit
